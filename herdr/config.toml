onboarding = false

[theme.custom]
panel_bg = "reset"   # transparent goto/picker overlays

[ui]
pane_gaps = false          # shared dividers instead of spaced-out panes (default true)
pane_outer_borders = false # no frame around the pane area; split dividers stay (pane_borders = "auto")
hide_tab_bar_when_single_tab = true # tab row height is fixed; hiding it is the only way to shrink the header
sidebar_start_collapsed = true      # takes effect on next launch; prefix+e toggles it back
sidebar_collapsed_mode = "hidden"   # zero width instead of the compact status rail

[terminal]
default_shell = "fish"

[keys]
prefix = "ctrl+a"
goto = "prefix+l"                  # pane/workspace tree picker (default prefix+g); l is free since focus_pane_right uses arrows
toggle_sidebar = "prefix+e"        # default prefix+b
edit_scrollback = ""               # default prefix+e; freed for toggle_sidebar

# tmux.conf equivalents
split_vertical = "prefix+|"        # bind |  split-window -h
split_horizontal = "prefix+minus"  # bind -  split-window -v
new_tab = "prefix+c"               # bind c  new-window
reload_config = "prefix+r"         # bind r  source-file
zoom = "prefix+m"                  # bind -r m resize-pane -Z
resize_pane_down = "prefix+j"      # bind -r j resize-pane -D
resize_pane_up = "prefix+k"        # bind -r k resize-pane -U
resize_pane_right = "prefix+shift+l" # bind -r L resize-pane -R
resize_pane_left = "prefix+h"      # bind -r h resize-pane -L
resize_mode = ""                   # default prefix+r; freed for reload

# direct (no prefix) ctrl+hjkl, mirroring vim-tmux-navigator in tmux; prefix+arrows kept as fallback.
# Herdr has no nvim passthrough: ctrl+hjkl is swallowed before pane apps (nvim splits) see it.
focus_pane_left = ["ctrl+h", "prefix+left"]
focus_pane_down = ["ctrl+j", "prefix+down"]
focus_pane_up = ["ctrl+k", "prefix+up"]
focus_pane_right = ["ctrl+l", "prefix+right"]

# tmux defaults
detach = "prefix+d"
close_tab = "prefix+ampersand"
rename_tab = "prefix+comma"

# prefix+0..9 switches to the Nth tab (0-indexed, tmux-window style);
# the built-in switch_tab is 1-indexed only, so it is disabled in favour of commands.
switch_tab = ""                    # default prefix+1..9

[[keys.command]]
key = "prefix+0"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 0"

[[keys.command]]
key = "prefix+1"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 1"

[[keys.command]]
key = "prefix+2"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 2"

[[keys.command]]
key = "prefix+3"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 3"

[[keys.command]]
key = "prefix+4"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 4"

[[keys.command]]
key = "prefix+5"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 5"

[[keys.command]]
key = "prefix+6"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 6"

[[keys.command]]
key = "prefix+7"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 7"

[[keys.command]]
key = "prefix+8"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 8"

[[keys.command]]
key = "prefix+9"
type = "shell"
command = "sh ~/.config/herdr/focus-tab.sh 9"
